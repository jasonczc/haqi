services:
    # 完整复刻 — privileged + host network（与 Cursor 一致）
    cursor-agent:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cursor-ctf
        hostname: cursor
        privileged: true
        network_mode: host
        environment:
            - CURSOR_AGENT=1
            - START_POD_DAEMON=false
            - START_EXEC_DAEMON=false
        volumes:
            - ./workspace:/workspace
            - ${SSH_AUTH_SOCK:-/dev/null}:/run/host-services/ssh-auth.sock
        extra_hosts:
            - "cursor:127.0.0.1"
            - "host.docker.internal:host-gateway"
        deploy:
            resources:
                limits:
                    cpus: "4"
                    memory: 16G

    # Bridge 模式 — 端口映射，不需要 privileged
    cursor-agent-bridge:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cursor-ctf-bridge
        hostname: cursor
        ports:
            - "5901:5901"
            - "9222:9222"
            - "26053:26053"
            - "26054:26054"
            - "26058:26058"
        environment:
            - CURSOR_AGENT=1
        volumes:
            - ./workspace:/workspace
        profiles:
            - bridge

    # 纯 shell 分析模式
    cursor-shell:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cursor-ctf-shell
        hostname: cursor
        entrypoint: /bin/bash
        stdin_open: true
        tty: true
        volumes:
            - ./workspace:/workspace
        profiles:
            - shell
